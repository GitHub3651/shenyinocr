<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EE28F"/>
      <stop offset="1" stop-color="#0A9B61"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity=".20"/>
    </filter>
  </defs>

  <!-- 圆形底 -->
  <circle cx="64" cy="64" r="52" fill="url(#g)" stroke="#214239" stroke-width="5" filter="url(#ds)"/>
  <!-- 内圈 -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#BDF7D9" stroke-width="4" opacity=".95"/>

  <!-- 对勾 -->
  <path d="M38 66 L55 82 L88 47"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>